<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>News Flow</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000; color: #fff;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    overflow: hidden;
  }
  #header {
    width: 100%; height: 5vh; min-height: 32px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 2.2vmin; color: #aaa;
    padding: 0 2vmin;
    border-bottom: 1px solid #222;
  }
  #header a { color: #8ab4ff; text-decoration: none; font-size: 2vmin; }
  #header a:hover { text-decoration: underline; }
  #header .hbtn {
    background: transparent; color: #8ab4ff;
    border: 1px solid #333; border-radius: 0.8vmin;
    font-size: 2vmin; line-height: 1;
    padding: 0.3vmin 1.2vmin; margin-left: 1vmin;
    cursor: pointer;
  }
  #header .hbtn:hover { background: #1a1a1a; }
  #header .hbtn:disabled { opacity: 0.35; cursor: default; }
  #header .hbtn.paused-active { background: #5a1818; color: #fff; border-color: #a33; }
  /* 左上: テレビニュース風の時計 + 3日天気（オーバーレイ表示） */
  #headLeft { display: flex; align-items: center; gap: 2vmin; min-width: 0; }
  #tvClock {
    font-size: 3.2vmin; font-weight: 800; letter-spacing: 0.08em;
    color: #fff; background: linear-gradient(180deg, #0b3d91, #061f4d);
    border: 1px solid #4a7fc9; border-radius: 0.8vmin;
    padding: 0.1vmin 1.6vmin; line-height: 1.3;
    text-shadow: 0 0 0.6vmin rgba(0,0,0,0.8);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #wxBox { display: flex; gap: 1.2vmin; font-size: 2.2vmin; color: #ddd; white-space: nowrap; }
  #wxBox .wx-item {
    background: #111; border: 1px solid #333; border-radius: 0.8vmin;
    padding: 0.2vmin 1.2vmin; line-height: 1.6;
  }
  #wxBox .wx-label { color: #8ab4ff; font-weight: 700; margin-right: 0.6vmin; }
  #wxBox .wx-pop { color: #9fc3ff; margin-left: 0.6vmin; }
  #wxBox .wx-temp { color: #ffd9a0; margin-left: 0.6vmin; }
  #voiceWarn {
    display: none;
    width: 100%;
    background: #663300; color: #ffcc66;
    font-size: 2.2vmin; text-align: center;
    padding: 0.8vmin;
    position: fixed; top: 0; left: 0; z-index: 5;
  }
  #main {
    display: flex;
    width: 100vw; height: 95vh;
  }
  /* 左: 記事内容 */
  #left {
    flex: 0 0 62%;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 3vmin 4vmin;
    overflow: hidden;
  }
  #prefRow { display: flex; align-items: center; gap: 1.5vmin; margin-bottom: 2vmin; flex-wrap: wrap; }
  #pref {
    display: inline-block;
    font-size: 4vmin; font-weight: 700;
    background: #c00; color: #fff;
    border-radius: 1vmin; padding: 0.5vmin 3vmin;
    letter-spacing: 0.1em;
  }
  #groupBadge {
    display: none;
    font-size: 2.4vmin; font-weight: 700;
    background: #0a4d8c; color: #cfe8ff;
    border-radius: 1vmin; padding: 0.5vmin 2vmin;
  }
  #title {
    font-size: 4.6vmin; font-weight: 700;
    line-height: 1.5;
    word-break: break-word;
    margin-bottom: 2.5vmin;
  }
  #title.linkable { cursor: pointer; }
  #title.linkable:hover { text-decoration: underline; }
  #title.linkable:focus-visible { outline: 2px solid #2f6fd0; outline-offset: 0.4vmin; }
  #photo {
    display: none;
    max-width: 100%; max-height: 30vh;
    object-fit: contain;
    border-radius: 1vmin;
    margin-bottom: 2vmin;
    background: #111;
  }
  #body {
    font-size: 2.9vmin; font-weight: 400;
    line-height: 1.9;
    color: #e8e8e8;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 6;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #body.empty { color: #777; }
  #related {
    margin-top: 2vmin;
    font-size: 2.2vmin; color: #9fc3ff;
    line-height: 1.7;
  }
  #related .rel-label { color: #6f9bd8; font-weight: 700; }
  #meta {
    margin-top: 2.5vmin;
    font-size: 2.3vmin; color: #bbb;
  }
  #counter {
    margin-top: 1vmin;
    font-size: 2vmin; color: #666;
  }
  #hint {
    margin-top: 1vmin;
    font-size: 1.9vmin; color: #555;
  }
  /* 右: タイトル一覧 */
  #right {
    flex: 1;
    border-left: 1px solid #222;
    display: flex; flex-direction: column;
    min-width: 0;
  }
  #listHeader {
    padding: 1.2vmin 2vmin;
    font-size: 2.2vmin; color: #aaa;
    border-bottom: 1px solid #222;
    white-space: nowrap;
  }
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 1vmin;
    scrollbar-width: thin;
  }
  .item {
    padding: 1.2vmin 1.5vmin;
    margin-bottom: 0.8vmin;
    border-radius: 0.8vmin;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .item:hover { background: #141414; }
  .item.active {
    background: #1c2b44;
    border-color: #2f6fd0;
  }
  .item .ip {
    display: inline-block;
    font-size: 1.9vmin; font-weight: 700;
    background: #c00; color: #fff;
    border-radius: 0.6vmin; padding: 0.1vmin 1.2vmin;
    margin-right: 1vmin;
  }
  .item .it { font-size: 2.3vmin; line-height: 1.5; word-break: break-word; }
  .item.active .it { font-weight: 700; }
  .item .ig {
    display: inline-block;
    font-size: 1.8vmin; color: #9fc3ff;
    background: #0a2c52; border-radius: 0.6vmin;
    padding: 0.1vmin 1vmin; margin-left: 1vmin;
  }
  .item .is {
    display: block;
    font-size: 1.8vmin; color: #777;
    margin-top: 0.4vmin;
  }
  #startOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.96);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 10; gap: 3vmin;
  }
  #startOverlay h1 { font-size: 5vmin; }
  #startOverlay p { font-size: 2.6vmin; color: #bbb; max-width: 80vw; line-height: 1.8; text-align: center; }
  #startBtn {
    font-size: 4vmin; font-weight: 700;
    padding: 2vmin 8vmin;
    border-radius: 2vmin; border: none; cursor: pointer;
    background: #c00; color: #fff;
  }
  #startBtn:hover { background: #e00; }
  #err { color: #f66; font-size: 2.4vmin; margin-top: 2vmin; min-height: 1em; }
  #ctrlRow { display: flex; gap: 1.5vmin; margin-top: 1vmin; flex-wrap: wrap; justify-content: center; }
  #ctrlRow button {
    font-size: 1.8vmin; padding: 0.8vmin 2.4vmin;
    border-radius: 1vmin; border: 1px solid #555; cursor: pointer;
    background: #222; color: #ccc;
  }
  #ctrlRow button:hover { background: #333; color: #fff; }
  #ver { font-size: 1.8vmin; color: #666; margin-top: 1vmin; }
  #ctrlMsg { font-size: 2vmin; color: #9fc3ff; min-height: 1em; }
  /* ライトモード（既定はダーク。body.light で上書き） */
  body.light { background: #f4f4f4; color: #222; }
  body.light #header { color: #666; border-bottom-color: #ddd; }
  body.light #header .hbtn { color: #1a56db; border-color: #bbb; }
  body.light #header .hbtn:hover { background: #e8e8e8; }
  body.light #tvClock { background: linear-gradient(180deg, #0b3d91, #061f4d); color: #fff; border-color: #4a7fc9; }
  body.light #wxBox { color: #333; }
  body.light #wxBox .wx-item { background: #fff; border-color: #ccc; }
  body.light #wxBox .wx-label { color: #1a56db; }
  body.light #wxBox .wx-pop { color: #1a56db; }
  body.light #wxBox .wx-temp { color: #b36b00; }
  body.light #voiceWarn { background: #fff3cd; color: #856404; }
  body.light #title { color: #111; }
  body.light #photo { background: #e0e0e0; }
  body.light #body { color: #333; }
  body.light #body.empty { color: #999; }
  body.light #related { color: #1a56db; }
  body.light #related .rel-label { color: #4a7fc9; }
  body.light #meta { color: #666; }
  body.light #counter { color: #999; }
  body.light #hint { color: #999; }
  body.light #right { border-left-color: #ddd; }
  body.light #listHeader { color: #666; border-bottom-color: #ddd; }
  body.light .item:hover { background: #e8e8e8; }
  body.light .item.active { background: #dbe7ff; border-color: #2f6fd0; }
  body.light .item .is { color: #888; }
  body.light #startOverlay { background: rgba(255,255,255,0.97); }
  body.light #startOverlay h1 { color: #111; }
  body.light #startOverlay p { color: #555; }
  body.light #err { color: #c00; }
  body.light #ctrlRow button { background: #fff; color: #333; border-color: #bbb; }
  body.light #ctrlRow button:hover { background: #e8e8e8; color: #111; }
  body.light #ver { color: #999; }
  body.light #ctrlMsg { color: #1a56db; }
  /* ライトモダン（テレビのニュースダイジェスト風。body.light-modern のみ。dark/light は不変） */
  body.light-modern { background: #edf1f4; color: #111; }
  body.light-modern #header { background: #fff; color: #556; border-bottom: 0.5vmin solid; border-image: linear-gradient(90deg, #00c8e0, #00d68a) 1; box-shadow: 0 0.3vmin 1vmin rgba(0,0,0,0.08); }
  body.light-modern #header a { color: #0090a8; }
  body.light-modern #header .hbtn { color: #0090a8; border-color: #bfe3ea; background: #fff; }
  body.light-modern #header .hbtn:hover { background: #e6f7fa; }
  body.light-modern #tvClock { background: linear-gradient(135deg, #00b8c4, #00d68a); color: #fff; border: none; border-radius: 0.6vmin; transform: skewX(-10deg); box-shadow: 0 0.3vmin 0.8vmin rgba(0,180,170,0.35); text-shadow: none; }
  body.light-modern #wxBox { color: #333; }
  body.light-modern #wxBox .wx-item { background: #fff; border-color: #d5e2e6; box-shadow: 0 0.2vmin 0.6vmin rgba(0,0,0,0.06); }
  body.light-modern #wxBox .wx-label { color: #0090a8; }
  body.light-modern #wxBox .wx-pop { color: #0090a8; }
  body.light-modern #wxBox .wx-temp { color: #b36b00; }
  body.light-modern #voiceWarn { background: #fff3cd; color: #856404; }
  body.light-modern #pref { background: linear-gradient(135deg, #00b8c4, #00d68a); font-size: 4.4vmin; border-radius: 0.8vmin; transform: skewX(-10deg); box-shadow: 0 0.4vmin 1vmin rgba(0,180,170,0.35); }
  body.light-modern #groupBadge { background: linear-gradient(135deg, #0090a8, #00bfa5); color: #fff; border-radius: 0.8vmin; transform: skewX(-10deg); box-shadow: 0 0.3vmin 0.8vmin rgba(0,150,160,0.3); }
  body.light-modern #title { background: #fff; color: #111; font-size: 4.6vmin; font-weight: 800; border-radius: 1.2vmin; border-left: 1.2vmin solid #00bfa5; padding: 1.5vmin 2.5vmin; box-shadow: 0 0.4vmin 1.2vmin rgba(0,0,0,0.1); }
  body.light-modern #photo { background: #fff; box-shadow: 0 0.4vmin 1.2vmin rgba(0,0,0,0.12); border-radius: 1.2vmin; }
  body.light-modern #body { background: #fff; color: #333; border-radius: 1.2vmin; padding: 1.5vmin 2.5vmin; box-shadow: 0 0.3vmin 1vmin rgba(0,0,0,0.08); }
  body.light-modern #body.empty { color: #999; }
  body.light-modern #related { color: #007a87; }
  body.light-modern #related .rel-label { color: #00a896; }
  body.light-modern #meta { color: #666; }
  body.light-modern #counter { color: #999; }
  body.light-modern #hint { color: #999; }
  body.light-modern #right { background: #f7fafb; border-left: none; }
  body.light-modern #listHeader { color: #556; border-bottom: 0.4vmin solid; border-image: linear-gradient(90deg, #00c8e0, #00d68a) 1; background: #fff; }
  body.light-modern .item { background: #fff; border-radius: 1vmin; border: 1px solid transparent; border-left: 0.8vmin solid #00c8b8; box-shadow: 0 0.2vmin 0.8vmin rgba(0,0,0,0.08); }
  body.light-modern .item:hover { background: #e6f7f3; }
  body.light-modern .item.active { background: #e0f7f0; border-color: #00bfa5; border-left: 0.8vmin solid #00bfa5; }
  body.light-modern .item .ip { background: linear-gradient(135deg, #00b8c4, #00d68a); font-size: 2.1vmin; border-radius: 0.6vmin; transform: skewX(-10deg); box-shadow: 0 0.2vmin 0.5vmin rgba(0,180,170,0.3); }
  body.light-modern .item .it { color: #111; }
  body.light-modern .item.active .it { color: #111; }
  body.light-modern .item .ig { color: #007a87; background: #d8f3ee; }
  body.light-modern .item .is { color: #888; }
  body.light-modern #startOverlay { background: rgba(237,241,244,0.97); }
  body.light-modern #startOverlay h1 { color: #111; }
  body.light-modern #startOverlay p { color: #555; }
  body.light-modern #startBtn { background: linear-gradient(135deg, #00b8c4, #00d68a); box-shadow: 0 0.4vmin 1.2vmin rgba(0,180,170,0.4); }
  body.light-modern #startBtn:hover { filter: brightness(1.05); }
  body.light-modern #err { color: #c00; }
  body.light-modern #ctrlRow button { background: #fff; color: #333; border-color: #bfe3ea; }
  body.light-modern #ctrlRow button:hover { background: #e6f7fa; color: #111; }
  body.light-modern #ver { color: #999; }
  body.light-modern #ctrlMsg { color: #0090a8; }
</style>
</head>
<body>
<script>try { var _t = localStorage.getItem('newsflow-theme'); if (_t === 'light' || _t === 'light-modern') document.body.classList.add(_t); } catch (e) {}</script>
<div id="voiceWarn">日本語音声が見つかりません。ブラウザの音声設定を確認してください。</div>
<div id="header">
  <div id="headLeft">
    <span id="tvClock">--:--</span>
    <span id="wxBox"><span class="wx-item" id="wx0">取得中…</span><span class="wx-item" id="wx1" style="display:none;"></span><span class="wx-item" id="wx2" style="display:none;"></span></span>
  </div>
  <span><button id="fsBtn" class="hbtn" type="button" title="フルスクリーンにする">⛶ フルスクリーン</button><button id="pauseBtn" class="hbtn" type="button" title="一時停止">⏸</button><button id="playBtn" class="hbtn" type="button" title="再生">▶</button>　<a href="/admin.html">RSS管理</a>　<a href="/" id="titleLink">タイトル</a></span>
</div>

<div id="main">
  <div id="left">
    <div id="prefRow"><span id="pref">待機中</span><span id="groupBadge"></span></div>
    <div id="title">ニュースを読み込んでいます…</div>
    <img id="photo" alt="" referrerpolicy="no-referrer" />
    <div id="body" class="empty"></div>
    <div id="related"></div>
    <div id="meta"></div>
    <div id="counter"></div>
    <div id="hint">→キー: 次の記事 / ←キー: 前の記事 / 右の一覧クリックでも移動できます / スペース: 一時停止・再開</div>
  </div>
  <div id="right">
    <div id="listHeader">タイトル一覧（<span id="listCount">0</span>件）</div>
    <div id="list"></div>
  </div>
</div>

<div id="startOverlay">
  <h1>News Flow</h1>
  <p>最新ローカルニュースを24時間連続で読み上げます。読ませたいRSSを登録し個人で使用してください。読み上げはブラウザの機能で行なっているのでブラウザによって品質は変わります</p>
  <button id="startBtn">ニュース再生を開始する</button>
  <div id="ctrlRow">
    <button id="settingsBtn" type="button">設定/RSSフィード管理</button>
    <button id="updateBtn" type="button">アップデート</button>
    <button id="rebootBtn" type="button">再起動</button>
  </div>
  <div id="ver">v.1.8.1</div>
  <div id="ctrlMsg"></div>
  <div id="err"></div>
</div>

<script>
'use strict';
// /api/news の playlist（類似分散済み・本文/要約付き）をその順序のまま再生する。
// playlist が無い旧応答の場合は prefectures[] の展開にフォールバックする。

let playlist = [];   // [{prefecture,title,link,source,pubDate,body,summary,groupId,groupSize,id}]
let idx = 0;
let started = false;
let speaking = false; // 現在発話中か（キー操作の多重進行防止用ではない。単なる状態）
let jaVoice = null;
let wakeLock = null;
// 読み上げ設定（/api/settings から取得。管理画面で変更可）
let ttsEnabled = true;
let ttsRate = 1.2;
// 一時停止・発話世代管理・バックグラウンド更新
// - playSeq: speak() ごとに加算する世代番号。Chrome は speechSynthesis.cancel() 時に
//   古い発話の onend/onerror を非同期発火させるため、世代が一致しない終了通知は無視する
//   （Firefox は発火しないため問題が出ないが、両対応のためガードする）。
let paused = false;
let playSeq = 0;
let pendingTimer = null;
let lastRefreshAt = 0;
let refreshTimer = null;
const REFRESH_INTERVAL_MS = 60 * 1000;
const MERGE_AHEAD = 3;

const elPref = document.getElementById('pref');
const elGroup = document.getElementById('groupBadge');
const elTitle = document.getElementById('title');
const elBody = document.getElementById('body');
const elRelated = document.getElementById('related');
const elMeta = document.getElementById('meta');
const elCounter = document.getElementById('counter');
const elTvClock = document.getElementById('tvClock');
const elWx = [document.getElementById('wx0'), document.getElementById('wx1'), document.getElementById('wx2')];
const elOverlay = document.getElementById('startOverlay');
const elErr = document.getElementById('err');
const elVoiceWarn = document.getElementById('voiceWarn');
const elList = document.getElementById('list');
const elListCount = document.getElementById('listCount');
const elPhoto = document.getElementById('photo');
if (elPhoto) {
  elPhoto.addEventListener('error', () => { hidePhoto(); });
}

function isHttpUrl(u) {
  return typeof u === 'string' && /^https?:\/\//.test(u);
}

function showPhoto(url) {
  if (!elPhoto) return;
  if (!isHttpUrl(url)) { hidePhoto(); return; }
  elPhoto.src = url;
  elPhoto.style.display = 'block';
}

function hidePhoto() {
  if (!elPhoto) return;
  elPhoto.removeAttribute('src');
  elPhoto.style.display = 'none';
}

// メイン画面の記事タイトルをクリックすると元記事を別タブで開く
function currentLink() {
  if (!Array.isArray(playlist) || playlist.length === 0) return '';
  const cur = playlist[idx];
  const url = cur && cur.link;
  return isHttpUrl(url) ? url : '';
}
function openCurrentLink() {
  const url = currentLink();
  if (!url) return;
  window.open(url, '_blank', 'noopener');
}
if (elTitle) {
  elTitle.addEventListener('click', openCurrentLink);
  elTitle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      e.stopPropagation(); // 文書側のスペース=一時停止・再開と二重動作させない
      openCurrentLink();
    }
  });
}

// 左上: テレビニュース風の時計（時：分・少し大きめのオーバーレイ表示）
function updateTvClock() {
  if (!elTvClock) return;
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  elTvClock.textContent = hh + ':' + mm;
}
updateTvClock();
setInterval(updateTvClock, 5000);

// 左上: 今日/明日/明後日の天気・降水確率・気温（/api/weather＝気象庁API経由）
async function fetchWeather() {
  try {
    const res = await fetch('/api/weather', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const days = (data && data.days) || [];
    days.slice(0, 3).forEach((day, i) => {
      const box = elWx[i];
      if (!box || !day) return;
      box.style.display = '';
      const pop = day.precip != null ? day.precip + '%' : '―%';
      box.innerHTML = '';
      const label = document.createElement('span');
      label.className = 'wx-label';
      label.textContent = day.label || '';
      const main = document.createElement('span');
      main.textContent = (day.icon ? day.icon + ' ' : '') + (day.weather || '―');
      const popEl = document.createElement('span');
      popEl.className = 'wx-pop';
      popEl.textContent = ' ' + pop;
      box.appendChild(label);
      box.appendChild(main);
      box.appendChild(popEl);
      // 気温は「最高/最低℃」（例: 22/18℃）。片方だけの場合も分かる形で出す
      let tempText = '';
      if (day.tmax != null && day.tmin != null) {
        tempText = ' ' + Math.round(day.tmax) + '/' + Math.round(day.tmin) + '℃';
      } else if (day.tmax != null) {
        tempText = ' 最高' + Math.round(day.tmax) + '℃';
      } else if (day.tmin != null) {
        tempText = ' 最低' + Math.round(day.tmin) + '℃';
      }
      if (tempText) {
        const tempEl = document.createElement('span');
        tempEl.className = 'wx-temp';
        tempEl.textContent = tempText;
        box.appendChild(tempEl);
      }
      const areaName = [data.pref, data.area].filter(Boolean).join(' ').trim();
      box.title = [areaName, day.date, day.detail || '', tempText.trim()]
        .filter(Boolean).join(' ').trim();
    });
  } catch (e) {
    if (elWx[0]) {
      elWx[0].style.display = '';
      elWx[0].textContent = '天気を取得できません';
    }
  }
}
fetchWeather();
setInterval(fetchWeather, 30 * 60 * 1000);

function pickVoice() {
  try {
    const voices = speechSynthesis.getVoices() || [];
    jaVoice =
      voices.find(v => v.lang === 'ja-JP') ||
      voices.find(v => v.lang && v.lang.startsWith('ja')) ||
      null;
    elVoiceWarn.style.display = (voices.length > 0 && !jaVoice) ? 'block' : 'none';
  } catch (e) { jaVoice = null; }
}
if ('speechSynthesis' in window) {
  pickVoice();
  if (typeof speechSynthesis.onvoiceschanged !== 'undefined') {
    speechSynthesis.onvoiceschanged = pickVoice;
  } else if (typeof speechSynthesis.addEventListener !== 'undefined') {
    speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }
} else {
  elVoiceWarn.style.display = 'block';
}

async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator && navigator.wakeLock.request) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* 失敗無視 */ }
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    try {
      if ('speechSynthesis' in window) speechSynthesis.resume();
    } catch (e) {}
    acquireWakeLock();
  }
});

function normalizePlaylist(data) {
  if (Array.isArray(data.playlist) && data.playlist.length > 0) {
    return data.playlist.map(p => ({
      prefecture: p.prefecture || '',
      title: p.title || '',
      link: p.link || '',
      source: p.source || '',
      pubDate: p.pubDate || '',
      body: p.body || '',
      summary: p.summary || '',
      groupId: p.groupId || null,
      groupSize: p.groupSize || 1,
      id: p.id || null,
      image: p.image || '',
      related: Array.isArray(p.related) ? p.related : [],
    }));
  }
  // 旧応答フォールバック: prefectures[] を順に展開
  const prefectures = Array.isArray(data.prefectures) ? data.prefectures : [];
  const list = [];
  for (const p of prefectures) {
    const arr = Array.isArray(p.news) ? p.news : [];
    for (const item of arr) {
      list.push({
        prefecture: p.prefecture,
        title: item.title, link: item.link || '', source: item.source || '',
        pubDate: item.pubDate || '', body: item.body || '', summary: item.summary || '',
        groupId: item.groupId || null, groupSize: item.groupSize || 1,
        id: item.id || null, image: item.image || '',
        related: Array.isArray(item.related) ? item.related : [],
      });
    }
  }
  return list;
}

async function loadNews() {
  const res = await fetch('/api/news', { cache: 'no-store' });
  if (!res.ok) throw new Error('API HTTP ' + res.status);
  return normalizePlaylist(await res.json());
}

// 設定・バージョンの反映（起動時に1回。失敗時は既定値のまま）
async function loadSettings() {
  try {
    const res = await fetch('/api/settings', { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    const s = (data && data.settings) || {};
    if (typeof s.ttsEnabled === 'boolean') ttsEnabled = s.ttsEnabled;
    if (Number.isFinite(Number(s.ttsRate))) ttsRate = Number(s.ttsRate);
    if (s.theme === 'light' || s.theme === 'dark' || s.theme === 'light-modern') applyTheme(s.theme);
  } catch (e) { /* 既定値で継続 */ }
}

// 画面テーマの適用（サーバー設定が正・localStorage はちらつき防止のキャッシュ）
function applyTheme(theme) {
  const t = theme === 'light-modern' ? 'light-modern' : theme === 'light' ? 'light' : 'dark';
  document.body.classList.toggle('light', t === 'light');
  document.body.classList.toggle('light-modern', t === 'light-modern');
  try { localStorage.setItem('newsflow-theme', t); } catch (e) {}
}

async function loadVersion() {
  try {
    const res = await fetch('/api/version', { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    const disp = (data && data.display) || (data && data.version ? 'v.' + data.version : null);
    if (disp) {
      const a = document.getElementById('ver');
      if (a) a.textContent = disp;
    }
  } catch (e) {}
}

// 本文・写真が空の項目は /api/article で1回だけ補完を試みる（次回以降の読み上げ用に蓄える）
async function backfillBody(item) {
  if ((item.body && item.image) || !item.link) return;
  try {
    const res = await fetch('/api/article?url=' + encodeURIComponent(item.link), { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    if (data && data.body && !item.body) {
      item.body = data.body;
      item.summary = data.summary || '';
    }
    if (data && data.image && !item.image) {
      item.image = data.image;
    }
    // 既に次の記事へ移動していたら表示は触らない
    if (playlist[idx] !== item) return;
    renderBody(item);
    if (item.image) showPhoto(item.image);
  } catch (e) { /* 失敗無視: タイトルのみ読み上げ */ }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function buildList() {
  elList.innerHTML = '';
  elListCount.textContent = String(playlist.length);
  playlist.forEach((cur, i) => {
    const div = document.createElement('div');
    div.className = 'item' + (i === idx ? ' active' : '');
    div.dataset.i = String(i);
    let inner = '<span class="ip">' + esc(cur.prefecture) + '</span>' +
      '<span class="it">' + esc(cur.title) + '</span>';
    if (cur.groupSize > 1) {
      inner += '<span class="ig">関連' + cur.groupSize + '件</span>';
    }
    inner += '<span class="is">' + esc(cur.source) + '</span>';
    div.innerHTML = inner;
    div.addEventListener('click', () => { jumpTo(i); });
    elList.appendChild(div);
  });
}

function highlightCurrent() {
  const children = elList.children;
  for (let i = 0; i < children.length; i++) {
    children[i].classList.toggle('active', i === idx);
  }
  scrollToCenter();
}

// 読み上げ中の行がリストの中央付近に来るようスクロールする。
// scrollIntoView({behavior:'smooth'}) は Chrome で連続呼び出し時に暴走するため、
// 矩形計算で一気に中央合わせする（smooth なし・Firefox/Chrome 同一挙動）。
function scrollToCenter() {
  const active = elList.children[idx];
  if (!active || typeof active.getBoundingClientRect !== 'function') return;
  if (typeof elList.getBoundingClientRect !== 'function') return;
  const listRect = elList.getBoundingClientRect();
  const r = active.getBoundingClientRect();
  const delta = (r.top + r.height / 2) - (listRect.top + listRect.height / 2);
  if (Math.abs(delta) > 1) elList.scrollTop += delta;
}

function renderBody(cur) {
  const text = cur.summary || cur.body;
  if (text) {
    elBody.textContent = text;
    elBody.classList.remove('empty');
  } else {
    elBody.textContent = '（本文を取得できませんでした。タイトルのみ読み上げます）';
    elBody.classList.add('empty');
  }
}

function showCurrent() {
  if (playlist.length === 0) {
    elPref.textContent = '待機中';
    elTitle.textContent = 'ニュースを取得中…';
    elTitle.classList.remove('linkable');
    elTitle.removeAttribute('tabindex');
    elTitle.removeAttribute('role');
    elTitle.removeAttribute('title');
    hidePhoto();
    elBody.textContent = '';
    elRelated.textContent = '';
    elMeta.textContent = '';
    elCounter.textContent = '';
    elGroup.style.display = 'none';
    return;
  }
  const cur = playlist[idx];
  elPref.textContent = cur.prefecture;
  elTitle.textContent = cur.title;
  if (isHttpUrl(cur.link)) {
    elTitle.classList.add('linkable');
    elTitle.setAttribute('tabindex', '0');
    elTitle.setAttribute('role', 'link');
    elTitle.setAttribute('title', '元記事を別タブで開く');
  } else {
    elTitle.classList.remove('linkable');
    elTitle.removeAttribute('tabindex');
    elTitle.removeAttribute('role');
    elTitle.removeAttribute('title');
  }
  showPhoto(cur.image);
  renderBody(cur);
  if (cur.groupSize > 1) {
    elGroup.style.display = 'inline-block';
    elGroup.textContent = '関連記事 ' + cur.groupSize + '件';
    // ひとまとめ表示: サーバーが付けた related（ suppressed された類似記事）を最大4件まで列挙。
    // playlist 自体は重複排除済み（同一グループは最初の1件のみ）のため、playlist 内検索はしない。
    const rel = (Array.isArray(cur.related) && cur.related.length > 0)
      ? cur.related
      : playlist.filter(p => p.groupId != null && p.groupId === cur.groupId && p !== cur).slice(0, 4);
    elRelated.innerHTML = '<span class="rel-label">同じ話題: </span>' +
      rel.slice(0, 4).map(s => esc(((s.prefecture ? s.prefecture + ' / ' : '') + (s.title || '')))).join('<br>');
  } else {
    elGroup.style.display = 'none';
    elRelated.textContent = '';
  }
  elMeta.textContent = [cur.source, cur.pubDate ? new Date(cur.pubDate).toLocaleString('ja-JP') : '']
    .filter(Boolean).join(' / ');
  elCounter.textContent = '全体 ' + (idx + 1) + '/' + playlist.length;
  highlightCurrent();
}

function speakText() {
  const cur = playlist[idx];
  // 読み上げ文: タイトル + 本文要約（3行程度・サーバー側で要約済み）。
  // 都道府県（「北海道」「全国」など）は画面表示のみで読み上げない。
  // 【NHK】【読売新聞】などの【...】も読み上げない（表示は元のまま）。
  const extra = cur.summary || cur.body;
  return buildSpeakText(cur.title, extra);
}

// 【...】で囲まれた部分を読み上げ対象から除去する（表示用原文は保持）。
function stripSpeakBrackets(s) {
  return (s || '').replace(/【[^】]*】/g, '');
}

// 読み上げ文を組み立てる（タイトル + 本文）。【...】は除去する。
function buildSpeakText(title, extra) {
  const t = stripSpeakBrackets(title).replace(/[ \t ]+/g, ' ').trim();
  const b = stripSpeakBrackets(extra || '').replace(/\s+/g, ' ').trim();
  if (!t) return b;
  return t + (b ? '。' + b : '');
}

function speak(text, onend) {
  showCurrent();
  if (paused) { speaking = false; return; }
  // 読み上げ Off の場合は発話せず一定時間表示して次へ
  if (!ttsEnabled) {
    if (pendingTimer) clearTimeout(pendingTimer);
    pendingTimer = setTimeout(() => { pendingTimer = null; onend(); }, 4000);
    return;
  }
  if (!('speechSynthesis' in window)) {
    if (pendingTimer) clearTimeout(pendingTimer);
    pendingTimer = setTimeout(() => { pendingTimer = null; onend(); }, 8000);
    return;
  }
  const mySeq = ++playSeq;
  try { speechSynthesis.cancel(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = ttsRate;
  u.pitch = 1.0;
  if (jaVoice) u.voice = jaVoice;
  const resumeTimer = setInterval(() => {
    try { if (speechSynthesis.speaking) speechSynthesis.resume(); } catch (e) {}
  }, 10000);
  const wrappedEnd = () => {
    clearInterval(resumeTimer);
    // Chrome では cancel() による古い発話の終了通知が遅れて届く。
    // 世代が変わっていたら二重進行になるため無視する。
    if (mySeq !== playSeq) return;
    if (paused) { speaking = false; return; }
    onend();
  };
  u.onend = wrappedEnd;
  u.onerror = wrappedEnd;
  try {
    speechSynthesis.speak(u);
  } catch (e) { wrappedEnd(); }
}

function stopSpeech() {
  // 古い発話の遅延 onend/onerror を無効化してから停止する（Chrome 対策）
  playSeq++;
  if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
}

function updatePauseUI() {
  const pb = document.getElementById('pauseBtn');
  const rb = document.getElementById('playBtn');
  if (pb) { pb.classList.toggle('paused-active', paused); pb.disabled = !started || paused; }
  if (rb) { rb.disabled = !started || !paused; }
}

// フルスクリーンが解除されたらこのボタンで再度入れ直せる（フルスクリーン中は解除動作）
function updateFsUI() {
  const fb = document.getElementById('fsBtn');
  if (!fb) return;
  const full = !!(document.fullscreenElement || document.webkitFullscreenElement);
  fb.textContent = full ? '⛶ 解除' : '⛶ フルスクリーン';
  fb.title = full ? 'フルスクリーンを解除する' : 'フルスクリーンにする';
}
async function toggleFullscreen() {
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) await document.exitFullscreen().catch(() => {});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen().catch(() => {});
    } else if (document.documentElement.webkitRequestFullscreen) {
      document.documentElement.webkitRequestFullscreen();
    }
  } catch (e) { /* 失敗無視 */ }
  updateFsUI();
}
document.addEventListener('fullscreenchange', updateFsUI);
if (document.webkitFullscreenElement !== undefined) {
  document.addEventListener('webkitfullscreenchange', updateFsUI);
}

function pausePlayback() {
  if (!started || paused) return;
  paused = true;
  stopSpeech();
  showCurrent();
  updatePauseUI();
}

function resumePlayback() {
  if (!started || !paused) return;
  paused = false;
  updatePauseUI();
  // 現在の記事の先頭から読み直す（Chrome/Firefox で挙動が同一になる方式）
  playAt(idx);
}

async function playAt(i) {
  if (!started) return;
  if (paused) { showCurrent(); return; }
  if (i < 0) i = 0;
  if (i >= playlist.length) {
    // 一周したら最新データを再取得してエンドレスループ
    try {
      const fresh = await loadNews();
      lastRefreshAt = Date.now();
      if (fresh.length > 0) { playlist = fresh; buildList(); }
    } catch (e) { console.warn('reload failed:', e); }
    i = 0;
    if (playlist.length === 0) {
      showCurrent();
      setTimeout(() => playAt(0), 60000);
      return;
    }
  }
  idx = i;
  const cur = playlist[idx];
  backfillBody(cur); // 非同期で補完（表示・次周に反映）
  maybeRefreshInBackground();
  speaking = true;
  speak(speakText(), () => {
    speaking = false;
    if (paused || !started) return;
    playAt(idx + 1);
  });
}

function jumpTo(i) {
  if (!started || playlist.length === 0) return;
  if (i < 0) i = 0;
  if (i >= playlist.length) i = playlist.length - 1;
  // 一時停止中は表示だけ移動し、発話は再開時まで行わない
  if (paused) {
    idx = i;
    showCurrent();
    return;
  }
  stopSpeech();
  speaking = false;
  // Chrome では cancel() 直後の speak() が欠落する場合があるため1フレーム以上空ける
  setTimeout(() => { if (!paused) playAt(i); }, 120);
}

// ---- 再生中の新規記事取り込み ----
// /api/news を定期取得し、未読の記事だけを「数個先」に差し込む。
// 現在の読み上げ位置 (idx) は動かさないため、聞いている途中で表示が飛ばない。
// サーバーは playlist を重複排除済み（同一グループは最初の1件のみ）で返すため、
// 取り込み時も既読との類似記事は除外する（県を跨いだ類似の再掲防止）。
function normalizeTitleFront(t) {
  return (t || '').trim().replace(/[ \t　]+/g, ' ');
}
function stripBracketsFront(s) {
  return (s || '').replace(/【[^】]*】/g, '').replace(/［[^］]*］/g, '').replace(/\[[^\]]*\]/g, '');
}
function titleTokensFront(title) {
  const t = stripBracketsFront(normalizeTitleFront(title))
    .replace(/[、。！？「」『』（）()・―—\-:：;；\/|｜@＠#＃★☆※・]/g, ' ')
    .trim();
  if (!t) return new Set();
  const tokens = new Set();
  const compact = t.replace(/\s+/g, '');
  for (let i = 0; i + 1 < compact.length; i++) {
    tokens.add(compact.slice(i, i + 2));
  }
  for (const w of t.split(/\s+/)) {
    if (w.length >= 2) tokens.add(w);
  }
  return tokens;
}
function isDateNumericTokenFront(tok) {
  if (!tok) return true;
  if (!/[0-9０-９]/.test(tok)) return false;
  return /^[0-9０-９年月日時分秒曜週日号付紙面掲版載第／\/．\.\-\-―—:：,，、\s\(\)（）［］【\]()]+$/.test(tok);
}
function contentTokensFront(title) {
  const all = titleTokensFront(title);
  const out = new Set();
  for (const t of all) {
    if (!isDateNumericTokenFront(t)) out.add(t);
  }
  return out;
}
// サーバー側 areSimilarTitles と同判定（link 一致は呼び出し側で判定）
function areSimilarTitlesFront(a, b) {
  const na = stripBracketsFront(normalizeTitleFront(a)).replace(/\s+/g, '');
  const nb = stripBracketsFront(normalizeTitleFront(b)).replace(/\s+/g, '');
  if (!na || !nb) return false;
  if (na === nb) return true;
  const short = Math.min(na.length, nb.length);
  if (short >= 8 && (na.includes(nb) || nb.includes(na))) return true;
  const ta = contentTokensFront(a);
  const tb = contentTokensFront(b);
  if (ta.size < 4 || tb.size < 4) return false;
  let inter = 0;
  for (const t of ta) if (tb.has(t)) inter++;
  if (inter < 2) return false;
  const union = ta.size + tb.size - inter;
  const j = union === 0 ? 0 : inter / union;
  const cont = inter / Math.min(ta.size, tb.size);
  if (j >= 0.3) return true;
  if (j >= 0.12 && cont >= 0.24 && inter >= 3) return true;
  return false;
}
function isDuplicateOfExisting(p, existing) {
  if (!p || !p.title) return true;
  for (const e of existing) {
    if (!e || !e.title) continue;
    if (p.link && e.link && p.link === e.link) return true;
    try {
      if (areSimilarTitlesFront(p.title, e.title)) return true;
    } catch (err) { /* 判定失敗時は重複にしない */ }
  }
  return false;
}
function itemKey(p) {
  if (!p) return '';
  if (p.id) return 'id:' + p.id;
  if (p.link) return 'link:' + p.link;
  return 'title:' + (p.title || '');
}

function mergeFreshPlaylist(fresh) {
  if (!Array.isArray(fresh) || fresh.length === 0) return 0;
  if (playlist.length === 0) {
    playlist = fresh.slice();
    idx = 0;
    buildList();
    showCurrent();
    return fresh.length;
  }
  const seen = new Set(playlist.map(itemKey));
  // 完全一致キーに加え、既読との類似タイトルも除外する（後追いの類似再掲を防ぐ）。
  // 既読・未読の両方と比較し、候補同士の類似も1件にまとめる。
  const picked = [];
  const newcomers = [];
  for (const p of fresh) {
    if (!p || !p.title || seen.has(itemKey(p))) continue;
    if (isDuplicateOfExisting(p, playlist) || isDuplicateOfExisting(p, picked)) continue;
    picked.push(p);
    newcomers.push(p);
  }
  if (newcomers.length === 0) return 0;
  const insertAt = Math.min(playlist.length, Math.max(0, idx + 1 + MERGE_AHEAD));
  playlist.splice(insertAt, 0, ...newcomers);
  buildList();
  // 左ペインは触らず、件数表示だけ最新化する（読み上げ中のちらつき防止）
  elCounter.textContent = '全体 ' + (idx + 1) + '/' + playlist.length;
  return newcomers.length;
}

async function refreshInBackground() {
  if (!started || paused) return;
  try {
    const fresh = await loadNews();
    lastRefreshAt = Date.now();
    mergeFreshPlaylist(fresh);
  } catch (e) { console.warn('background refresh failed:', e); }
}

function maybeRefreshInBackground() {
  if (!started || paused) return;
  if (Date.now() - lastRefreshAt < REFRESH_INTERVAL_MS) return;
  lastRefreshAt = Date.now(); // 多重取得防止に先に更新
  loadNews().then((fresh) => {
    lastRefreshAt = Date.now();
    mergeFreshPlaylist(fresh);
  }).catch((e) => { console.warn('background refresh failed:', e); });
}

function startRefreshTimer() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(refreshInBackground, REFRESH_INTERVAL_MS);
}

// 右キー=次 / 左キー=前（リピート抑制）/ スペース=一時停止・再開
document.addEventListener('keydown', (e) => {
  if (!started) return;
  if (e.repeat) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); jumpTo(idx + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); jumpTo(idx - 1); }
  else if (e.key === ' ' || e.code === 'Space') {
    // ボタンにフォーカスがある場合の二重動作を避ける
    if (document.activeElement && (document.activeElement.tagName === 'BUTTON' || document.activeElement.tagName === 'INPUT')) return;
    e.preventDefault();
    if (paused) resumePlayback(); else pausePlayback();
  }
});

document.getElementById('startBtn').addEventListener('click', async () => {
  elErr.textContent = '';
  await loadSettings();
  try {
    playlist = await loadNews();
  } catch (e) {
    console.error(e);
    elErr.textContent = 'ニュースの取得に失敗しました: ' + e.message;
    return;
  }
  if (playlist.length === 0) {
    elErr.textContent = 'ニュースを取得中… 60秒後にもう一度お試しください。';
    showCurrent();
    setTimeout(async () => {
      if (started) return;
      try {
        const retry = await loadNews();
        if (retry.length > 0) {
          playlist = retry;
          started = true;
          paused = false;
          elOverlay.style.display = 'none';
          acquireWakeLock();
          lastRefreshAt = Date.now();
          startRefreshTimer();
          updatePauseUI();
          buildList();
          playAt(0);
        }
      } catch (e) {}
    }, 60000);
    return;
  }
  started = true;
  paused = false;
  elOverlay.style.display = 'none';
  acquireWakeLock();
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.lang = 'ja-JP';
    speechSynthesis.speak(u);
    speechSynthesis.cancel();
  } catch (e) {}
  playSeq++;
  lastRefreshAt = Date.now();
  startRefreshTimer();
  updatePauseUI();
  buildList();
  playAt(0);
  try {
    if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen().catch(() => {});
    }
  } catch (e) {}
});

// トップ下部の小さな3ボタン
document.getElementById('settingsBtn').addEventListener('click', () => {
  window.location.href = '/admin.html';
});
document.getElementById('updateBtn').addEventListener('click', async () => {
  const msg = document.getElementById('ctrlMsg');
  if (!confirm('GitHub から更新を取得し、再起動しますか？')) return;
  msg.textContent = 'アップデート中…（git pull → npm install → 再起動）';
  try {
    const res = await fetch('/api/update', { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
    msg.textContent = '更新を開始しました。再起動後に自動で最新ニュースを取得します。数十秒後にページをリロードしてください。';
    setTimeout(() => window.location.reload(), 45000);
  } catch (e) {
    msg.textContent = 'アップデートに失敗しました: ' + e.message;
  }
});
document.getElementById('rebootBtn').addEventListener('click', async () => {
  const msg = document.getElementById('ctrlMsg');
  if (!confirm('サービスを再起動しますか？（再起動時に自動再取得します）')) return;
  msg.textContent = '再起動中…';
  try {
    const res = await fetch('/api/restart', { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
    msg.textContent = '再起動を開始しました。30秒ほど待ってリロードしてください。';
    setTimeout(() => window.location.reload(), 30000);
  } catch (e) {
    msg.textContent = '再起動に失敗しました: ' + e.message;
  }
});

// 起動前のプレビュー表示
updatePauseUI();
updateFsUI();
document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);
document.getElementById('pauseBtn').addEventListener('click', pausePlayback);
document.getElementById('playBtn').addEventListener('click', resumePlayback);
loadSettings().then(loadVersion);
loadNews().then((list) => {
  if (list.length > 0) {
    playlist = list;
    idx = 0;
    buildList();
    showCurrent();
  } else {
    showCurrent();
  }
}).catch(() => { showCurrent(); });
</script>
</body>
